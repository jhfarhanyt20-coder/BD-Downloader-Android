name: Build APK

# Only a version tag (v1.2.3) publishes anything: the final release with the APK
# and latest.json (what the app's updater reads). Pushes to main and dev only
# check that the app builds; no test builds are ever published.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs the same Python version as the app (3.11) to install yt-dlp at build time
      - name: Set up Python 3.11
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "Building version $v"

      - name: Signing key (from GitHub Secrets, never in the repository)
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ]; then echo "::error::SIGNING_KEY_B64 secret is missing"; exit 1; fi
          echo "$SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          VD_BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # Only the last three releases keep working: an app older than the third-newest
      # release shows "Update required" until it is updated.
      - name: Oldest version still allowed (the last three releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$( (gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' 2>/dev/null || true; echo "v${APP_VERSION}") \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n -u)
          min=$(echo "$tags" | tail -n 3 | head -n 1)
          echo "MIN_VERSION=${min:-$APP_VERSION}" >> "$GITHUB_ENV"
          echo "Releases: $(echo $tags) -> oldest allowed ${min:-$APP_VERSION}"

      - name: Name the APK and write latest.json
        run: |
          mkdir -p out
          apk="out/VibeDownloader-${APP_VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c %s "$apk")
          printf '{\n  "version": "%s",\n  "url": "https://github.com/%s/releases/download/v%s/VibeDownloader-%s.apk",\n  "size": %s,\n  "sha256": "%s",\n  "min_version": "%s"\n}\n' \
            "$APP_VERSION" "$GITHUB_REPOSITORY" "$APP_VERSION" "$APP_VERSION" "$size" "$sha" "$MIN_VERSION" > out/latest.json
          cat out/latest.json
          rm -f "$SIGNING_STORE_FILE"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Download **VibeDownloader-${APP_VERSION}.apk** on your Android phone and open it to install. Installed apps update themselves."
          if [ -f "release-notes/v${APP_VERSION}.md" ]; then notes="$(cat "release-notes/v${APP_VERSION}.md")"; fi
          gh release create "$GITHUB_REF_NAME" "out/VibeDownloader-${APP_VERSION}.apk" out/latest.json \
            --title "VibeDownloader for Android ${APP_VERSION}" --verify-tag --latest --repo "$GITHUB_REPOSITORY" \
            --notes "$notes"

      - name: Check the release has the APK and latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for n in "VibeDownloader-${APP_VERSION}.apk" latest.json; do
            echo "$names" | grep -qx "$n" || { echo "::error::release is missing $n"; exit 1; }
          done
          echo "All assets present"
