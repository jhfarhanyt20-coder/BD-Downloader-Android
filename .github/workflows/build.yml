name: Build APK

# Every push to main builds a signed test APK and publishes it as the "preview"
# pre-release (a direct download link for testing on a phone). A version tag
# (v1.2.3) builds the real release: APK + latest.json (what the app's updater reads).
# A push to "dev" only checks that the app compiles: nothing is kept or published.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "Building version $v"

      - name: Signing key (from GitHub Secrets, never in the repository)
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ]; then echo "::error::SIGNING_KEY_B64 secret is missing"; exit 1; fi
          echo "$SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK and write latest.json
        run: |
          mkdir -p out
          apk="out/VibeDownloader-${APP_VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c %s "$apk")
          printf '{\n  "version": "%s",\n  "url": "https://github.com/%s/releases/download/v%s/VibeDownloader-%s.apk",\n  "size": %s,\n  "sha256": "%s"\n}\n' \
            "$APP_VERSION" "$GITHUB_REPOSITORY" "$APP_VERSION" "$APP_VERSION" "$size" "$sha" > out/latest.json
          cat out/latest.json
          rm -f "$SIGNING_STORE_FILE"

      - name: Keep the APK with this run
        if: github.ref != 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: VibeDownloader-${{ env.APP_VERSION }}
          path: out/
          retention-days: 7

      - name: Publish the test build (preview)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create preview "out/VibeDownloader-${APP_VERSION}.apk" --prerelease --target "$GITHUB_SHA" \
            --title "Test build ${APP_VERSION}" \
            --notes "Test build for checking on a phone. Download the APK on the phone and open it to install. Not a final release." \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "out/VibeDownloader-${APP_VERSION}.apk" out/latest.json \
            --title "VibeDownloader for Android ${APP_VERSION}" --verify-tag --repo "$GITHUB_REPOSITORY" \
            --notes "Download **VibeDownloader-${APP_VERSION}.apk** on your Android phone and open it to install."
